<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · 칠판 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--board:#24372d;--board2:#1d2e25;--frame:#6b4a2f;--chalk:#f1efe6;--dim:rgba(241,239,230,.6);
    --yellow:#f4d35e;--pink:#f29e9e;--blue:#9ed2f2;--green:#a8e0a0;--orange:#f0a868}
  *{box-sizing:border-box}
  body{margin:0;background:#2b2118;color:var(--chalk);font-family:"Noto Sans KR",sans-serif;line-height:1.6}
  .wrap{max-width:1000px;margin:0 auto;padding:14px}
  .back{display:inline-block;margin:0 0 10px;color:var(--yellow);text-decoration:none;font-size:.95rem}
  .board{background:radial-gradient(ellipse at 30% 20%,#2c4436 0%,var(--board) 45%,var(--board2) 100%);
    border:14px solid var(--frame);border-radius:10px;box-shadow:inset 0 0 60px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.5);
    padding:18px 18px 22px;margin-bottom:18px}
  h1,h2,h3{font-family:"Nanum Pen Script",cursive;font-weight:400;letter-spacing:.5px}
  h1{font-size:2.5rem;margin:0 0 6px;line-height:1.15}
  h1 small{display:block;font-size:1.45rem;color:var(--yellow)}
  h2{font-size:2rem;margin:4px 0 8px;color:var(--yellow)}
  h3{font-size:1.5rem;margin:4px 0;color:var(--yellow)}
  p{margin:6px 0}
  .lead{color:var(--dim);font-size:.95rem}
  .grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .canvasBox{background:rgba(0,0,0,.12);border:1px dashed rgba(241,239,230,.25);border-radius:8px;padding:6px}
  canvas{display:block;width:100%;touch-action:manipulation}
  .msg{font-family:"Nanum Pen Script",cursive;font-size:1.55rem;min-height:2.1rem;color:var(--green);text-align:center;line-height:1.25;margin:6px 0}
  .stat{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:.9rem;color:var(--dim)}
  .stat b{color:var(--chalk)}
  button,.tab{font-family:"Noto Sans KR",sans-serif;font-size:.92rem;background:transparent;color:var(--chalk);
    border:1.5px solid rgba(241,239,230,.6);border-radius:6px;padding:7px 12px;cursor:pointer}
  button:hover{background:rgba(241,239,230,.1)}
  button.on,.tab.on{background:var(--chalk);color:var(--board2);font-weight:700}
  button.primary{border-color:var(--yellow);color:var(--yellow)}
  .controls,.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .row{margin:10px 0}
  .row label{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
  .row label b{color:var(--yellow);white-space:nowrap}
  .row input[type=range]{width:100%;accent-color:var(--yellow)}
  .row .hint{font-size:.8rem;color:var(--dim)}
  .num{width:100%;padding:8px 10px;border-radius:6px;border:1.5px solid rgba(241,239,230,.4);background:rgba(0,0,0,.2);color:var(--chalk);font-size:1rem}
  .check{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;border:1px solid rgba(241,239,230,.18);margin:6px 0;cursor:pointer}
  .check input{margin-top:5px;width:18px;height:18px;accent-color:var(--yellow)}
  .check .d{font-size:.84rem;color:var(--dim)}
  .big{font-family:"Nanum Pen Script",cursive;font-size:2.4rem;color:var(--yellow);line-height:1.1}
  .note{border-left:3px solid var(--yellow);padding:4px 10px;margin:10px 0;font-size:.92rem}
  .teacher li{margin:6px 0}
  .hl{color:var(--yellow)} .hp{color:var(--pink)} .hb{color:var(--blue)} .hg{color:var(--green)} .ho{color:var(--orange)}
  table{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:8px}
  td,th{border-bottom:1px dashed rgba(241,239,230,.25);padding:6px 4px;text-align:left;vertical-align:top}
  th{font-family:"Nanum Pen Script",cursive;font-size:1.3rem;font-weight:400;color:var(--yellow)}
  .tblwrap{overflow-x:auto}
  .q{border:1px solid rgba(241,239,230,.2);border-radius:8px;padding:10px 12px;margin:10px 0}
  .q .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .q .opts button.right{background:rgba(168,224,160,.25);border-color:var(--green)}
  .q .opts button.wrong{background:rgba(242,158,158,.2);border-color:var(--pink)}
  .q .exp{display:none;font-size:.9rem;margin-top:8px;color:var(--dim)}
  .q.done .exp{display:block}
  .foot{font-size:.8rem;color:var(--dim);text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 시뮬레이션 목록</a>
  <div class="board">
    <h1>{{headline}}<small>{{sub}}</small></h1>
    {{intro}}
  </div>
  <div class="board">
    {{sim}}
  </div>
  <div class="board teacher">
    <h2>선생님 한마디 — 시험에 나오는 것만</h2>
    {{teacher}}
  </div>
  <div class="board">
    <h2>쪽지시험 4문제</h2>
    <div id="quiz"></div>
    <p class="foot">시뮬레이션은 이해를 돕기 위한 단순 모델이에요. 실제 수치는 수종·환경·조건에 따라 달라요.</p>
  </div>
</div>
<script>
/* ---------- 공통 도우미 ---------- */
const CH={chalk:'#f1efe6',dim:'rgba(241,239,230,.55)',faint:'rgba(241,239,230,.16)',yellow:'#f4d35e',pink:'#f29e9e',
  blue:'#9ed2f2',green:'#a8e0a0',orange:'#f0a868',brown:'#b0773f',red:'#e2675c',purple:'#c9a0f0'};
const $=id=>document.getElementById(id);
function makeCanvas(id, ratio, draw){
  const cv=$(id), ctx=cv.getContext('2d'); const st={cv,ctx,W:0,H:0,draw};
  function rs(){ const d=window.devicePixelRatio||1; const w=Math.max(200,cv.parentElement.clientWidth-12);
    st.W=w; st.H=Math.round(w*(typeof ratio==='function'?ratio():ratio));
    cv.width=st.W*d; cv.height=st.H*d; cv.style.height=st.H+'px'; ctx.setTransform(d,0,0,d,0,0); if(st.ready&&st.draw) st.draw(); }
  window.addEventListener('resize',rs); st.resize=rs; rs(); setTimeout(()=>{ st.ready=true; st.draw&&st.draw(); },0);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(rs);
  return st;
}
function txt(ctx,t,x,y,size,color,align,W){
  if(W) size=Math.min(size, W/15);
  ctx.font=size+'px "Nanum Pen Script","Noto Sans KR",cursive'; ctx.fillStyle=color||CH.chalk; ctx.textAlign=align||'center'; ctx.fillText(t,x,y);
}
function line(ctx,x1,y1,x2,y2,color,w,dash){ ctx.beginPath(); ctx.setLineDash(dash||[]); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle=color||CH.chalk; ctx.lineWidth=w||2; ctx.stroke(); ctx.setLineDash([]); }
function circle(ctx,x,y,r,fill,stroke,w){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w||2;ctx.stroke();} }
function rect(ctx,x,y,w,h,fill,stroke,lw){ if(fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.strokeRect(x,y,w,h);} }
function arrow(ctx,x1,y1,x2,y2,color,w){ line(ctx,x1,y1,x2,y2,color,w); const a=Math.atan2(y2-y1,x2-x1),s=7+(w||2)*1.5;
  ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-s*Math.cos(a-0.45),y2-s*Math.sin(a-0.45)); ctx.lineTo(x2-s*Math.cos(a+0.45),y2-s*Math.sin(a+0.45)); ctx.closePath(); ctx.fillStyle=color||CH.chalk; ctx.fill(); }
function val(id){ const e=$(id); return e.type==='checkbox'? e.checked : +e.value; }
function onInputs(ids,fn){ ids.forEach(i=>{ const e=$(i); e.addEventListener('input',fn); e.addEventListener('change',fn); }); fn(); }
function setText(id,t){ const e=$(id); if(e) e.textContent=t; }
function msg(t,color){ const e=$('msg'); if(e){ e.textContent=t; e.style.color=color||CH.green; } }
function segButtons(containerId, onPick){ const c=$(containerId); const bs=[...c.querySelectorAll('button')];
  bs.forEach(b=>b.addEventListener('click',()=>{ bs.forEach(x=>x.classList.remove('on')); b.classList.add('on'); onPick(b.dataset.v,b); })); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function renderQuiz(QS){ const box=$('quiz');
  QS.forEach((it,k)=>{ const d=document.createElement('div'); d.className='q';
    d.innerHTML=`<div><b>Q${k+1}.</b> ${it.q}</div><div class="opts"></div><div class="exp">💡 ${it.e}</div>`;
    const opts=d.querySelector('.opts');
    it.o.forEach((t,i)=>{ const b=document.createElement('button'); b.textContent=t; b.onclick=()=>{ if(d.classList.contains('done')) return;
      d.classList.add('done'); b.classList.add(i===it.a?'right':'wrong'); opts.children[it.a].classList.add('right'); }; opts.appendChild(b); });
    box.appendChild(d); });
}
</script>
<script>
{{js}}
</script>
<script>
renderQuiz({{quiz}});
</script>
</body>
</html>
